<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    /* HUD instrumentation is a dark-glass display by nature — this page commits
       to that single visual world rather than adapting to a light host theme. */
    --void:#060a11;
    --panel:#0b141f;
    --panel-floor:#050b12;
    --edge:#173743;
    --accent:#4dd8c7;
    --accent-dim:#1f5f5a;
    --warn:#ffb454;
    --crit:#ff6a72;
    --ok:#7dffb0;
    --ink:#dcf3ee;
    --ink-dim:#6f939a;
    --font-display:'Orbitron', 'Segoe UI', system-ui, sans-serif;
    --font-body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(77,216,199,.07), transparent 60%),
      radial-gradient(ellipse at center, #0a1219 0%, var(--void) 72%);
    color:var(--ink);
    font-family:var(--font-body);
    overflow-x:hidden;
  }
  h1,h2,#status-line,#wake-btn,.tag{font-family:var(--font-display);}
  h2{text-wrap:balance;}
  .scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg, rgba(77,216,199,0.025) 0px, rgba(77,216,199,0.025) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:screen;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;border-bottom:1px solid var(--edge);
    letter-spacing:4px;
  }
  header h1{
    margin:0;font-size:1.3rem;font-weight:700;color:var(--accent);
    text-shadow:0 0 14px rgba(77,216,199,.55);
  }
  header .status{font-size:.7rem;color:var(--ink-dim);letter-spacing:2px;font-weight:500;}
  #core-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:56px 20px 20px;position:relative;
  }
  #radar{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:420px;height:420px;pointer-events:none;
    background:
      repeating-radial-gradient(circle at center, rgba(77,216,199,.05) 0, rgba(77,216,199,.05) 1px, transparent 1px, transparent 70px),
      conic-gradient(from 0deg, rgba(77,216,199,.06), transparent 25%);
    border-radius:50%;
    mask-image:radial-gradient(circle, black 55%, transparent 78%);
  }
  #orb{
    width:180px;height:180px;border-radius:50%;position:relative;z-index:1;
    border:2px solid var(--accent);
    box-shadow:0 0 30px rgba(77,216,199,.32), inset 0 0 30px rgba(77,216,199,.15);
    display:flex;align-items:center;justify-content:center;
    transition:box-shadow .3s ease, border-color .3s ease;
  }
  #orb::before,#orb::after{
    content:"";position:absolute;border-radius:50%;border:1px solid var(--edge);
  }
  #orb::before{inset:-18px;animation:spin 12s linear infinite;}
  #orb::after{inset:-34px;border-style:dashed;animation:spin 20s linear infinite reverse;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #orb-core{
    width:60%;height:60%;border-radius:50%;
    background:radial-gradient(circle, rgba(77,216,199,.9), rgba(77,216,199,.05));
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7;}50%{transform:scale(1.05);opacity:1;}}
  body.listening #orb{border-color:var(--warn);box-shadow:0 0 40px rgba(255,180,84,.5), inset 0 0 30px rgba(255,180,84,.2);}
  body.listening #orb-core{background:radial-gradient(circle, rgba(255,180,84,.9), rgba(255,180,84,.05));animation:pulse 1s ease-in-out infinite;}
  body.speaking #orb{border-color:var(--ok);box-shadow:0 0 46px rgba(125,255,176,.55), inset 0 0 30px rgba(125,255,176,.25);}
  body.speaking #orb-core{background:radial-gradient(circle, rgba(125,255,176,.95), rgba(125,255,176,.05));animation:pulse .5s ease-in-out infinite;}
  #signals{display:flex;gap:18px;margin-top:20px;font-family:var(--font-mono);font-size:.68rem;letter-spacing:1px;color:var(--ink-dim);}
  #signals span b{color:var(--ink-dim);font-weight:500;}
  #signals .on{color:var(--accent);}
  #cue{margin-top:16px;text-align:center;color:var(--ink-dim);font-size:.95rem;letter-spacing:.3px;max-width:420px;line-height:1.5;}
  #cue b{color:var(--accent);font-weight:600;}
  #transcript{margin-top:8px;min-height:1.2em;color:var(--warn);font-size:.85rem;letter-spacing:.5px;font-family:var(--font-mono);}
  #wake-btn{
    margin-top:20px;background:transparent;border:1px solid var(--accent-dim);color:var(--accent);
    padding:9px 20px;border-radius:3px;font-size:.7rem;letter-spacing:2px;cursor:pointer;font-weight:500;
    transition:all .2s ease;
  }
  #wake-btn:hover{border-color:var(--accent);box-shadow:0 0 12px rgba(77,216,199,.35);}
  #wake-btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;padding:12px 32px 48px;max-width:1200px;margin:0 auto;
    opacity:0;transform:translateY(16px);transition:opacity .6s ease, transform .6s ease;
  }
  #grid.revealed{opacity:1;transform:translateY(0);}
  .panel{
    background:linear-gradient(160deg, var(--panel), var(--panel-floor));
    border:1px solid var(--edge);border-radius:6px;padding:18px 20px;
    position:relative;overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:.7;
  }
  .panel h2{
    margin:0 0 12px;font-size:.72rem;letter-spacing:2.5px;color:var(--accent);font-weight:500;
    text-transform:uppercase;display:flex;align-items:center;gap:8px;
  }
  .panel h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);flex:none;}
  .big-stat{font-family:var(--font-mono);font-size:2rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .sub-stat{color:var(--ink-dim);font-size:.78rem;margin-top:4px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .item{border-top:1px solid rgba(77,216,199,.08);padding:10px 0;font-size:.85rem;}
  .item:first-of-type{border-top:none;padding-top:0;}
  .item .tag{
    display:inline-block;font-size:.62rem;letter-spacing:1px;padding:2px 8px;border-radius:2px;
    margin-bottom:4px;text-transform:uppercase;font-weight:500;
  }
  .tag.high{background:rgba(255,106,114,.14);color:var(--crit);border:1px solid rgba(255,106,114,.4);}
  .tag.medium{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid rgba(255,180,84,.4);}
  .tag.low{background:rgba(77,216,199,.1);color:var(--accent);border:1px solid rgba(77,216,199,.3);}
  .item .title{color:var(--ink);font-weight:600;margin:2px 0;font-family:var(--font-body);}
  .item .meta{color:var(--ink-dim);font-size:.75rem;}
  .foot-note{margin-top:14px;color:var(--ink-dim);font-size:.7rem;line-height:1.5;border-top:1px dashed var(--edge);padding-top:10px;}
  .foot-note a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent-dim);}
  footer{text-align:center;color:var(--ink-dim);font-size:.68rem;letter-spacing:2px;padding-bottom:30px;font-family:var(--font-mono);}
  #mic-error{color:var(--crit);font-size:.75rem;margin-top:10px;display:none;text-align:center;max-width:420px;}
  @media (prefers-reduced-motion: reduce){
    #orb::before,#orb::after,#orb-core{animation:none;}
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<header>
  <h1>J&thinsp;A&thinsp;V&thinsp;I&thinsp;S</h1>
  <div class="status" id="status-line">STANDBY</div>
</header>

<div id="core-wrap">
  <div id="radar"></div>
  <div id="orb"><div id="orb-core"></div></div>
  <div id="signals">
    <span>MIC <b id="sig-mic">STANDBY</b></span>
    <span>VOICE <b id="sig-voice">STANDBY</b></span>
  </div>
  <div id="cue">Clap twice, then say <b>&ldquo;Wake up, Daddy is home&rdquo;</b> to activate.</div>
  <div id="transcript"></div>
  <button id="wake-btn">ENABLE MICROPHONE</button>
  <div id="mic-error"></div>
</div>

<div id="grid"></div>
<footer>JAVIS DASHBOARD &middot; DATA REFRESHED FROM data/briefing.json</footer>

<script>
// Fallback copy of data/briefing.json for when the page is opened via file://
// (local fetch() is blocked by CORS in that mode). Keep in sync with data/briefing.json.

      }
    ],
    "lowPriorityCategories": ["LinkedIn notifications", "Newsletters (Africa/Zambia fintech digests, Premier League, HISTORY, Adobe, Creative Market, BongoHive)", "Routine Binance deposit/withdrawal/P2P notifications", "TronScan transfer alerts (informational)", "Zambia e-GP tender publications (unless actively bidding)", "Zanaco/Google routine login notifications (appear self-initiated)"]
  },

    ],

  },

    "period": "2026-08-03 to 2026-09-14 (still logged on the August tab — no September tab created yet)",
    "approxTransactionCount": "~150 rows total (~95-100 in August, ~55 more into September)",
    "zambiaLeg": { "currency": "ZMW", "revenue": 1114.56, "fees": 570.90, "profit": 543.66 },
    "russiaLeg": { "currency": "ZMW-equivalent", "revenue": 12200.34, "fees": 0, "profit": 12200.34 },
    "latestRunningBalance": { "zambiaZMW": 17990.67, "russiaZMWEquiv": 29186.40, "asOf": "2026-09-14" },

  "audio": {

    "action": "Top up ElevenLabs credits to restore higher-quality narration."

const state = { claps: [], armed: false, recognizing: false, data: null, micFailed: false };

async function loadBriefing(){
  try{
    const res = await fetch('data/briefing.json', {cache:'no-store'});
    state.data = await res.json();
  }catch(e){
    // file:// pages can't fetch local JSON — fall back to the embedded copy.
    state.data = window.__EMBEDDED_BRIEFING__;
  }
  renderDashboard(state.data);
}

function fmtDate(iso, allDay){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, allDay
    ? {weekday:'short', month:'short', day:'numeric', year:'numeric'}
    : {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

function renderDashboard(d){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Forex panel
  grid.appendChild(panel(`
    <h2><span class="dot"></span>${d.forex.pair} &middot; market reference</h2>
    <div class="big-stat">K${d.forex.rate.toFixed(2)}</div>
    <div class="sub-stat">as of ${d.forex.asOf}</div>
    <div class="foot-note">${d.forex.source} <a href="${d.forex.sourceUrl}" target="_blank" style="color:var(--accent)">source &#8599;</a></div>
  `));

  // Email panel
  const emailItems = d.email.needsAttention.map(e => `
    <div class="item">
      <span class="tag ${e.priority}">${e.priority}</span>
      <div class="title">${e.subject}</div>
      <div class="meta">${e.from} &mdash; ${e.reason}</div>
    </div>
  `).join('');
  grid.appendChild(panel(`
    <h2><span class="dot"></span>Inbox ${d.email.windowLabel}</h2>
    <div class="sub-stat">${d.email.threadsReviewed} &middot; ${d.email.needsAttention.length} need your attention</div>
    ${emailItems}
    <div class="foot-note">Everything else: ${d.email.lowPriorityCategories.join(', ')}.</div>
  `));

  // Calendar panel
  const calItems = d.calendar.upcoming.map(ev => `
    <div class="item">
      <div class="title">${ev.summary}</div>
      <div class="meta">${fmtDate(ev.start, ev.allDay)}</div>
    </div>
  `).join('');
  grid.appendChild(panel(`
    <h2><span class="dot"></span>Upcoming &middot; ${d.calendar.timeZone}</h2>
    ${calItems}
    <div class="foot-note">${d.calendar.note}</div>
  `));

  // Tayant Pay panel
  const t = d.tayantPay;
  grid.appendChild(panel(`
    <h2><span class="dot"></span>Tayant Pay &middot; ${t.tab} ledger</h2>
    <div class="big-stat">~${t.approxTransactionCount}</div>
    <div class="sub-stat">transactions logged &middot; ${t.period}</div>
    <div class="item">
      <div class="title">Zambia (Kwacha) leg</div>
      <div class="meta">Revenue K${t.zambiaLeg.revenue.toLocaleString()} &middot; Fees K${t.zambiaLeg.fees.toLocaleString()} &middot; Profit K${t.zambiaLeg.profit.toLocaleString()}</div>
    </div>
    <div class="item">
      <div class="title">Russia leg</div>
      <div class="meta">Revenue K${t.russiaLeg.revenue.toLocaleString()} &middot; Profit K${t.russiaLeg.profit.toLocaleString()}</div>
    </div>
    <div class="foot-note">Latest balance (as of ${t.latestRunningBalance.asOf}): Zambia K${t.latestRunningBalance.zambiaZMW.toLocaleString()}, Russia leg K${t.latestRunningBalance.russiaZMWEquiv.toLocaleString()}. ${t.note} <a href="${t.sourceFileUrl}" target="_blank" style="color:var(--accent)">Open sheet &#8599;</a></div>
  `));

  document.getElementById('status-line').textContent = 'BRIEFING READY';
  requestAnimationFrame(()=>grid.classList.add('revealed'));
}

function panel(html){
  const el = document.createElement('div');
  el.className = 'panel';
  el.innerHTML = html;
  return el;
}

function buildSpokenBriefing(d){
  const attn = d.email.needsAttention.map(e => `${e.subject}, from ${e.from}: ${e.reason}`).join('. ');
  const cal = d.calendar.upcoming.map(ev => `${ev.summary} on ${fmtDate(ev.start, ev.allDay)}`).join(', ');
  return `Good day. The Kwacha is trading at ${d.forex.rate} per US dollar as of ${d.forex.asOf}. `
    + `Inbox review, ${d.email.windowLabel}: ${d.email.threadsReviewed}, with ${d.email.needsAttention.length} needing your attention: ${attn}. `
    + `Your next upcoming events are: ${cal}. `
    + `On Tayant Pay: the ${d.tayantPay.tab} tab logs roughly ${d.tayantPay.approxTransactionCount} transactions, with a Zambia leg profit of ${d.tayantPay.zambiaLeg.profit} kwacha, and a latest balance of ${d.tayantPay.latestRunningBalance.zambiaZMW} kwacha as of ${d.tayantPay.latestRunningBalance.asOf}.`;
}

function setSignal(id, text, on){
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.toggle('on', !!on);
}

function speak(text){
  if(!('speechSynthesis' in window)){ return; }
  document.body.classList.add('speaking');
  setSignal('sig-voice', 'SPEAKING', true);
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.98;
  utter.pitch = 0.9;
  utter.onend = () => {
    document.body.classList.remove('speaking');
    setSignal('sig-voice', 'STANDBY', false);
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// --- Wake trigger: two claps, then the wake phrase ---
async function armListening(){
  const errBox = document.getElementById('mic-error');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);

    state.armed = true;
    document.getElementById('status-line').textContent = 'LISTENING FOR CLAPS';
    document.body.classList.add('listening');
    setSignal('sig-mic', 'LIVE', true);

    function tick(){
      analyser.getByteFrequencyData(data);
      const volume = data.reduce((a,b)=>a+b,0) / data.length;
      const now = Date.now();
      if(volume > 55){ // clap-level transient
        state.claps = state.claps.filter(t => now - t < 1500);
        state.claps.push(now);
        if(state.claps.length >= 2){
          state.claps = [];
          onDoubleClap();
        }
      }
      requestAnimationFrame(tick);
    }
    tick();
  }catch(e){
    state.micFailed = true;
    errBox.style.display = 'block';
    errBox.textContent = 'Microphone access denied or unavailable — click the button again to trigger the briefing manually.';
    const btn = document.getElementById('wake-btn');
    btn.textContent = 'PLAY BRIEFING NOW';
    document.getElementById('status-line').textContent = 'MIC UNAVAILABLE — MANUAL MODE';
    setSignal('sig-mic', 'OFFLINE', false);
  }
}

function onDoubleClap(){
  document.getElementById('status-line').textContent = 'CLAPS DETECTED — SAY THE WAKE PHRASE';
  setSignal('sig-voice', 'LISTENING', true);
  startSpeechRecognition();
}

function startSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('mic-error').style.display = 'block';
    document.getElementById('mic-error').textContent = 'Speech recognition is not supported in this browser — use the button below instead.';
    setSignal('sig-voice', 'UNSUPPORTED', false);
    return;
  }
  if(state.recognizing) return;
  state.recognizing = true;
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.maxAlternatives = 3;
  rec.onresult = (event) => {
    const transcript = Array.from(event.results).map(r => r[0].transcript).join(' ').toLowerCase();
    document.getElementById('transcript').textContent = transcript;
    if(transcript.includes('wake up') && transcript.includes('daddy')){
      rec.stop();
      activate();
    }
  };
  rec.onend = () => {
    state.recognizing = false;
    if(!document.body.classList.contains('speaking')){ setSignal('sig-voice', 'STANDBY', false); }
  };
  rec.start();
}

function activate(){
  document.getElementById('status-line').textContent = 'ACTIVE';
  document.getElementById('cue').textContent = 'Welcome home. Here is your briefing.';
  document.getElementById('transcript').textContent = '';
  if(state.data){ speak(buildSpokenBriefing(state.data)); }
}

document.getElementById('wake-btn').addEventListener('click', () => {
  if(state.armed || state.micFailed){ activate(); }
  else { armListening(); }
});

loadBriefing();
</script>
</body>
